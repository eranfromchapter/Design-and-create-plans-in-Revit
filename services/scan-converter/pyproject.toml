[project]
name = "scan-converter"
version = "0.1.0"
description = "Lane A: Polycam floor-plan DXF -> reviewed ChapterLayout for Commit #0 (PLAN.md Phase 2)"
requires-python = ">=3.12"
dependencies = [
    "chapter-contracts",
    "ezdxf>=1.4.4,<1.5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.13,<0.15",
    "httpx>=0.28,<1",
]

[tool.uv.sources]
chapter-contracts = { path = "../../packages/contracts/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scan_converter"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
