[project]
name = "aidm-bridge"
version = "0.1.0"
description = "Phase 7: exported views -> control maps -> fixed prompt -> AIDM renders; deterministic finish-selection validator (PLAN.md Part E Phase 7; renderer behind an interface, mocked in CI)"
requires-python = ">=3.12"
dependencies = [
    "chapter-contracts",
    "revit-sim",
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
    "httpx>=0.28,<1",
    "opencv-python-headless==4.14.0.94",
    "numpy>=2,<3",
    "jsonschema[format]>=4.25,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "hypothesis>=6.100,<7",
    "ruff>=0.13,<0.15",
    "layout-compiler",
]

[tool.uv.sources]
chapter-contracts = { path = "../../packages/contracts/python", editable = true }
revit-sim = { path = "../../tools/revit-sim", editable = true }
# dev-only: the golden chain builders (generator + sim-replay tests); runtime deps above
layout-compiler = { path = "../layout-compiler", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidm_bridge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
