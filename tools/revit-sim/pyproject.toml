[project]
name = "revit-sim"
version = "0.1.0"
description = "Headless Revit stand-in: same WSS protocol, same verification, in-memory model, canonical SVG renderer (PLAN.md Part C)"
requires-python = ">=3.12"
dependencies = [
    "chapter-contracts",
    "websockets>=15,<16",
    "resvg-py>=0.5,<0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.13,<0.15",
    "cryptography>=50,<51",
]

[tool.uv.sources]
chapter-contracts = { path = "../../packages/contracts/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revit_sim"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
