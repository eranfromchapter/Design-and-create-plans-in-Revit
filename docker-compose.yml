# Local infrastructure only (PLAN.md Part C). Services join in Phase 1.
# Redis was deliberately removed in v1.1 (delivery-7): nothing uses it yet;
# re-adding it is a decision, not default plumbing.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chapter
      POSTGRES_PASSWORD: chapter
      POSTGRES_DB: revit_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chapter -d revit_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
